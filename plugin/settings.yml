name: MLS Team Tracker
description: MLS team stats & upcoming games
tagline: MLS team stats & upcoming games
category: Sports
strategy: Polling
polling_verb: GET
polling_url: "https://trmnl-mls-plugin.ryanhanwu.workers.dev/mls?team=##{{ mls_team_id }}"
polling_interval: 3600

